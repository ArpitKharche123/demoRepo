spring:
  cache:
    type: redis
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:localhost:6379,localhost:6380,localhost:6381,localhost:6382,localhost:6383,localhost:6384}
  application:
    name: ORDER-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: root1234
  jpa:
    hibernate:
     ddl-auto: update
    show-sql: false
server:
  port: 8082


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
  endpoint:
    prometheus:
      access: UNRESTRICTED
  prometheus:
    metrics:
      export:
        enabled: true
